# Ollama Code Review Configuration

# Model to use for code review
model: qwen3.5:9b

# Scope of the review
scope: changed-only

# Language of the review comments
language: english

# Maximum number of issues to report per file
max-issues-per-file: 10

# Severity levels to report
severity:
  - high
  - medium
  - low

# Categories to check
categories:
  - security
  - performance
  - code-quality
  - best-practices
