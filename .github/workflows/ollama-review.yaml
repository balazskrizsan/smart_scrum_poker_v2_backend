name: Ollama PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
   contents: read
   pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
    
      - name: Debug PR information
        run: |
          echo "=== PR INFORMATION ==="
          echo "Event: ${{ github.event_name }}"
          echo "PR number: ${{ github.event.pull_request.number }}"
          echo "Base ref: ${{ github.event.pull_request.base.ref }}"
          echo "Base SHA: ${{ github.event.pull_request.base.sha }}"
          echo "Head ref: ${{ github.event.pull_request.head.ref }}"
          echo "Head SHA: ${{ github.event.pull_request.head.sha }}"
          echo
    
          echo "=== CHANGED FILES ==="
          git diff --name-status \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
          echo
    
          echo "=== DIFF STAT ==="
          git diff --stat \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
          echo
    
          echo "=== DIFF ==="
          git diff \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
    
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.1.3
        with:
          bun-version: 1.3.10

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama Server
        run: ollama serve &

      - name: Pull and Run Model
        run: |
          ollama pull qwen2:0.5b
          ollama run qwen2:0.5b "Írj egy üdvözlést!"

      - name: Check Ollama
        run: |
          ollama list
          ollama run qwen3.5:9b "Say OK"
    
      - name: Debug Ollama
        run: |
          echo "=== OLLAMA VERSION ==="
          ollama --version
          echo
    
          echo "=== OLLAMA MODELS ==="
          ollama list
          echo
    
          echo "=== OLLAMA API ==="
          curl -s http://localhost:11434/api/tags
          echo
    
      - name: Run Ollama code review
        uses: SingulioDev/ollama-code-review-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ollama-api-url: http://localhost:11434
          ollama-api-key: local
          config-path: .github/code-review-config.yml
