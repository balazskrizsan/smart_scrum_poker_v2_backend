name: OpenCodeReview PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Run OpenCodeReview
        continue-on-error: true
        uses: alibaba/open-code-review@main
        with:
          llm_url: https://generativelanguage.googleapis.com/v1beta/openai
          llm_auth_token: ${{ secrets.GEMINI_API_KEY }}
          llm_model: gemini-2.5-pro
          llm_use_anthropic: 'false'
          llm_extra_body: '{"thinking":{"type":"disabled"}}'
      
      - name: Dump OCR logs
        if: always()
        run: |
          echo "=== OCR STDERR ==="
          if [ -f /tmp/ocr-stderr.log ]; then
            cat /tmp/ocr-stderr.log
          else
            echo "No /tmp/ocr-stderr.log"
          fi
          echo
          echo "=== OCR RESULT ==="
          if [ -f /tmp/ocr-result.json ]; then
            cat /tmp/ocr-result.json
          else
            echo "No /tmp/ocr-result.json"
          fi
