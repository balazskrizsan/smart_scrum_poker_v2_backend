name: Ollama PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: write
  issues: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.1.3
        with:
          bun-version: 1.3.10

      - name: Setup Ollama
        uses: ai-action/setup-ollama@v2.0.14
        with:
          model: kimi-2.5

      - name: Run Ollama code review
        uses: SingulioDev/ollama-code-review-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ollama-api-url: http://localhost:11434
          ollama-api-key: local
          config-path: .github/code-review-config.yml
