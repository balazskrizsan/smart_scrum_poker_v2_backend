name: OpenCodeReview PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@main
        with:
          llm_url: https://generativelanguage.googleapis.com/v1beta/openai
          llm_auth_token: ${{ secrets.GEMINI_API_KEY }}
          llm_model: gemini-2.5-pro
          llm_use_anthropic: 'false'
          llm_extra_body: '{"thinking":{"type":"disabled"}}'

      - name: Dump OCR artifacts
        if: always()
        run: |
          echo "=== Files ==="
          find . -type f -print
          
          echo
          echo "=== OCR logs ==="
          find . -type f \
            \( -iname '*ocr*' -o -iname '*review*' -o -iname '*.log' \) \
            -print -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \;
